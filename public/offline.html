<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokenQuest - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      opacity: 0.5;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 18px;
      color: #9CA3AF;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .button {
      display: inline-block;
      padding: 12px 32px;
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: transform 0.2s;
    }
    .button:hover {
      transform: translateY(-2px);
    }
    .status {
      margin-top: 32px;
      padding: 12px;
      background: rgba(139, 92, 246, 0.1);
      border-radius: 8px;
      font-size: 14px;
      color: #D1D5DB;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      Looks like you've lost your internet connection. TokenQuest requires an active 
      connection to access your gaming stats, chat with friends, and earn tokens.
    </p>
    <a href="/" class="button" onclick="location.reload(); return false;">Try Again</a>
    <div class="status" id="status">
      Checking connection...
    </div>
  </div>

  <script>
    // Check connection status
    function updateStatus() {
      const status = document.getElementById('status');
      if (navigator.onLine) {
        status.textContent = '✅ Connection restored! Reloading...';
        status.style.background = 'rgba(16, 185, 129, 0.1)';
        setTimeout(() => {
          location.reload();
        }, 1000);
      } else {
        status.textContent = '❌ No internet connection';
        status.style.background = 'rgba(239, 68, 68, 0.1)';
      }
    }

    // Check status on load
    updateStatus();

    // Listen for connection changes
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);

    // Check periodically
    setInterval(updateStatus, 3000);
  </script>
</body>
</html>
