<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>QuestCord - Turn Game Time Into Real Rewards</title>
    <meta name="title" content="QuestCord - Gaming Rewards Platform" />
    <meta name="description" content="The ultimate gaming platform where every match counts. Earn tokens, compete in tournaments, and dominate leaderboards. Join QuestCord today!" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#6366F1" />
    <meta name="msapplication-TileColor" content="#6366F1" />
    
    <!-- Apple Touch Icon & Meta Tags -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuestCord" />
    
    <!-- Icons for various sizes -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16x16.png" />
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileImage" content="/icon-144x144.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://questcord.app/" />
    <meta property="og:title" content="QuestCord - Turn Game Time Into Real Rewards" />
    <meta property="og:description" content="The ultimate gaming platform where every match counts. Earn tokens, compete in tournaments, and dominate the leaderboards." />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://questcord.app/" />
    <meta property="twitter:title" content="QuestCord - Turn Game Time Into Real Rewards" />
    <meta property="twitter:description" content="The ultimate gaming platform where every match counts. Earn tokens, compete in tournaments, and dominate the leaderboards." />
    <meta property="twitter:image" content="/og-image.png" />
    
    <!-- Additional SEO -->
    <meta name="keywords" content="gaming rewards, earn tokens gaming, gaming platform, esports tournaments, gaming leaderboard, free gaming rewards, play to earn" />
    <meta name="author" content="QuestCord" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://questcord.app/" />
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "QuestCord",
      "url": "https://questcord.app",
      "description": "Gaming rewards platform where every match counts. Earn tokens, compete in tournaments, and dominate leaderboards.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Windows, Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5.0",
        "ratingCount": "3",
        "reviewCount": "3"
      },
      "author": {
        "@type": "Organization",
        "name": "QuestCord",
        "url": "https://questcord.app"
      },
      "featureList": "Earn tokens while gaming, Free tournaments every 6 hours, Voice chat and messaging, Auto game detection, Cross-game progression, Instant payouts"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration (Production Only) -->
    <script>
      // Only register service worker in production (not localhost)
      if ('serviceWorker' in navigator && window.location.hostname !== 'localhost') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('✅ Service Worker registered:', registration.scope);
            })
            .catch((error) => {
              console.log('❌ Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
